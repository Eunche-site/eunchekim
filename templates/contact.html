{% extends "base.html" %}
{% block title %}Contact — Eun Che Kim{% endblock %}
{% block desc %}Contact violinist Eun Che Kim.{% endblock %}
{% block main %}
<main>
  <div class="page">
    <h1 class="page-title">Contact</h1>
    <div class="contact-wrap">
      <form class="contact-form" action="https://formsubmit.co/infoeunchekim@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New message from eunchekim website">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="row">
          <div><label for="f-name">Name</label><input id="f-name" name="name" required autocomplete="name"></div>
          <div><label for="f-email">Email</label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
        </div>
        <div><label for="f-subject">Subject</label><input id="f-subject" name="subject"></div>
        <div><label for="f-message">Message</label><textarea id="f-message" name="message" required></textarea></div>
        <button class="btn" type="submit">Send</button>
        <p class="form-status" role="status"></p>
      </form>
      <div class="contact-links">
        <a href="mailto:infoeunchekim@gmail.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg><span>infoeunchekim@gmail.com</span></a>
        <a href="https://www.instagram.com/eunchekim/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg><span>@eunchekim</span></a>
        <a href="https://www.youtube.com/@eunchekim" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg><span>YouTube</span></a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
