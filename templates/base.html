<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Eun Che Kim — Violinist{% endblock %}</title>
<meta name="description" content="{% block desc %}Official website of violinist Eun Che Kim (김은채): biography, concerts, media and contact.{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.desc() }}">
<meta property="og:image" content="{{ url_for('static', filename='images/home-1.jpg', _external=True) }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='assets/style.css') }}">
<script>try{var l=localStorage.getItem("lang");if(l)document.documentElement.setAttribute("data-lang",l)}catch(e){}</script>
{% block head %}{% endblock %}
</head>
<body class="{{ page }}">
<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}">Eun Che Kim</a>
  <button class="menu-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
  <nav class="nav" aria-label="Main">
    <ul>
      {% for endpoint, label in [('home','Home'),('biography','Biography'),('concerts','Concerts'),('media','Media'),('contact','Contact')] %}
      <li><a href="{{ url_for(endpoint) }}"{% if page == endpoint %} aria-current="page"{% endif %}>{{ label }}</a></li>
      {% endfor %}
    </ul>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button><span>/</span><button data-lang="ko" aria-pressed="false">KO</button>
    </div>
  </nav>
</header>
{% block main %}{% endblock %}
<footer class="site-footer">
  <span>&copy; 2026 <a class="quiet" href="{{ url_for('login') }}" rel="nofollow">Eun Che Kim</a></span>
  <span class="social">
    <a href="https://www.instagram.com/eunchekim/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.youtube.com/@eunchekim" target="_blank" rel="noopener">YouTube</a>
    <a href="mailto:infoeunchekim@gmail.com">Email</a>
  </span>
</footer>
<script src="{{ url_for('static', filename='assets/site.js') }}"></script>
</body>
</html>
