name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily rebuild so past concerts drop off
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Shrink large uploaded photos
        run: python scripts/optimize_images.py

      - name: Save shrunk photos back to the repository
        run: |
          if [ -n "$(git status --porcelain static/uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/uploads
            git commit -m "Optimize uploaded photos"
            git pull --rebase
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: python build.py
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
